org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 沙箱约束：Gradle 缓存重定向到工作区（源码在 F 盘，产物/缓存在 D:\DSH_Works）
org.gradle.projectcachedir=D:/DSH_Works/gradle-project-cache

# 项目路径 F:\编程文件\... 含中文，AGP 默认拒绝非 ASCII 路径（Windows），关闭检查
android.overridePathCheck=true

# Kotlin 编译器持久目录（.kotlin/sessions）重定向到工作区
kotlin.project.persistent.dir=D:/DSH_Works/kotlin-persistent
